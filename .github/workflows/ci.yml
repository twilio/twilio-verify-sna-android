name: CI

# Mirrors the CircleCI trigger exactly: every push to every branch. Only the
# release work is branch-gated. Note that Danger cannot comment without a
# pull_request context -- add `pull_request: {branches: [dev, main]}` here and
# widen the concurrency group below if PR comments are wanted.
on:
  push:

# Not parity, but an unfiltered push trigger stacks runs on force-pushed
# branches. Superseded runs are cancelled instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job resolves its runner from `vars.CI_RUNNER`, falling back to
# ubuntu-latest. Setting that one repo variable moves the whole pipeline to a
# self-hosted label with no code change. It is left unset because the
# twilio-internal-* labels used elsewhere in the org are unconfirmed for this
# public repo. Daemon usage is controlled per-task inside the lanes rather than
# by a global GRADLE_OPTS, which would fight setup-gradle's cache handling.
jobs:
  # Job bodies are deliberately a single fastlane call: all build logic lives in
  # fastlane/Fastfile so it runs identically here, on any other CI, or locally.
  assemble:
    name: Assemble
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - name: Assemble the project
        run: bundle exec fastlane assemble

  ktlint:
    name: Ktlint
    needs: [assemble]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - name: Run ktlint
        run: bundle exec fastlane lint

  unit_tests:
    name: Unit tests
    needs: [ktlint]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write # Danger comments on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env

      - name: Run unit tests with coverage
        run: bundle exec fastlane test

      # Replaces CircleCI's store_test_results. There is no native test-results
      # UI here, and upload-artifact takes the source path directly, so the
      # mkdir/cp staging the CircleCI job needed is gone rather than ported.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: verify_sna/build/test-results/testDebugUnitTest/
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-sna-code-coverage
          path: verify_sna/build/reports/kover/
          if-no-files-found: error

      # Non-blocking, matching danger-shroud's failIfUnderProjectThreshold: false.
      # Also cannot post on a bare push (no PR context) or from a fork PR, whose
      # token is read-only -- so a failure here must not fail the build.
      - name: Report code coverage
        continue-on-error: true
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane report_code_coverage

  size_report:
    name: Size report
    needs: [unit_tests]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env

      - name: Generate the size report
        run: bundle exec fastlane size_report

      # Replaces persist_to_workspace. The release flow reads
      # builds/sizeReport/VerifySNASDKSizeReport.txt from this artifact.
      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: builds/sizeReport/
          if-no-files-found: error
