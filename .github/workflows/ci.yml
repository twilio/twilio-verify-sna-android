name: CI

# Mirrors CircleCI: every push to every branch. Danger needs a pull_request
# context to comment, so add `pull_request:` here if PR comments are wanted.
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ubuntu-latest-large is required: on plain ubuntu-latest jobs queue forever and
# are never assigned a runner. This repo is a member of the org's
# `github-hosted-large` pool. `vars.CI_RUNNER` overrides the label.
jobs:
  assemble:
    name: Assemble
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - name: Assemble the project
        run: bundle exec fastlane assemble

  ktlint:
    name: Ktlint
    needs: [assemble]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - name: Run ktlint
        run: bundle exec fastlane lint

  unit_tests:
    name: Unit tests
    needs: [ktlint]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    permissions:
      contents: read
      pull-requests: write # Danger comments on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env

      - name: Run unit tests with coverage
        run: bundle exec fastlane test

      # Replaces CircleCI's store_test_results.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: verify_sna/build/test-results/testDebugUnitTest/
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-sna-code-coverage
          path: verify_sna/build/reports/kover/
          if-no-files-found: error

      # Non-blocking, matching danger-shroud's failIfUnderProjectThreshold: false.
      - name: Report code coverage
        continue-on-error: true
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane report_code_coverage

  size_report:
    name: Size report
    needs: [unit_tests]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env

      - name: Generate the size report
        run: bundle exec fastlane size_report

      # Replaces persist_to_workspace; the release flow reads this artifact.
      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: builds/sizeReport/
          if-no-files-found: error
