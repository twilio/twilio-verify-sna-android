name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-env

      - name: Generate the size report
        run: bundle exec fastlane size_report

      - name: Prepare release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER_NAME: ${{ secrets.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}
        run: bundle exec fastlane prepare_release
