version: 2.1

orbs:
  android: circleci/android@3.1.0

references:
  workspace: &workspace
    .

  executor: &executor
    name: android/android_machine
    tag: default

  ## Cache
  gradle_key: &gradle_key
    jars-{{ checksum "build.gradle.kts" }}-{{ checksum "verify_sna/build.gradle.kts"}}

  restore_gradle_cache: &restore_gradle_cache
    restore_cache:
      key: *gradle_key

  save_gradle_cache: &save_gradle_cache
    save_cache:
      key: *gradle_key
      paths:
        - ~/.gradle

commands:
  # Every job drives fastlane now, so every job needs the gem bundle.
  setup:
    steps:
      - checkout
      - restore_cache:
          key: v1-gems-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install Gems
          command: bundle check || (bundle config set --local path 'vendor/bundle' && bundle install)
      - save_cache:
          key: v1-gems-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

jobs:
  assemble:
    executor: *executor
    steps:
      - setup
      - *restore_gradle_cache
      - run:
          name: Assembling the project
          command: bundle exec fastlane assemble
      - *save_gradle_cache

  ktlint_check:
    executor: *executor
    steps:
      - setup
      - *restore_gradle_cache
      - run:
          name: Running Ktlint
          command: bundle exec fastlane lint
      - *save_gradle_cache

  unit_tests:
    executor: *executor
    steps:
      - setup
      - *restore_gradle_cache
      - run:
          name: Running Unit Tests
          command: bundle exec fastlane test
      - *save_gradle_cache
      - store_artifacts:
          path: "verify_sna/build/reports/kover"
          destination: verify_sna_code_coverage
      # CircleCI-only staging: store_test_results needs results laid out in its
      # own directory. GitHub Actions' upload-artifact takes the source path
      # directly, so this deliberately is NOT a fastlane lane -- it is deleted
      # at cutover rather than ported.
      - run:
          name: Staging JUnit results for store_test_results
          command: |
            mkdir -p test-results
            cp -R verify_sna/build/test-results/testDebugUnitTest/ test-results/verify_sna
      - store_test_results:
          path: "test-results"
      - run:
          name: Run the code coverage reporter
          command: bundle exec fastlane report_code_coverage

  size_report:
    executor: *executor
    steps:
      - setup
      - *restore_gradle_cache
      - run:
          name: Generating Size Report
          command: bundle exec fastlane size_report
      - *save_gradle_cache
      - store_artifacts:
          path: "verify_sna/build/outputs/sizeReport"
          destination: sizeReport
      - persist_to_workspace:
          root: *workspace
          paths:
            - builds

  release:
    executor: *executor
    steps:
      - setup
      - attach_workspace:
          at: *workspace
      - *restore_gradle_cache
      - run:
          name: Install signing key
          command: bundle exec fastlane install_signing_key
      - run:
          name: Releasing the project
          command: bundle exec fastlane release
      - *save_gradle_cache

workflows:
  workflow:
    jobs:
      - assemble
      - ktlint_check:
            requires:
                - assemble
      - unit_tests:
          context:
            - verify-sna
          requires:
            - ktlint_check
      - size_report:
          requires:
            - unit_tests
      - release:
          context:
            - verify-sna
            - verify-sna-android
            - verify-maven-publishing-android
          requires:
            - size_report
          filters:
            branches:
              only:
                - main
